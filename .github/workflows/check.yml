name: check and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or missing, so nothing was deployed"
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
      - name: Wait for the new version to be live
        run: scripts/wait-live.sh
      - run: npx playwright install --with-deps webkit firefox
      - name: Check the live site
        run: LIVE=1 npx playwright test --grep-invert "looks the same"
